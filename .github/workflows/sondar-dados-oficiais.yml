name: Sondar dados oficiais PNCP e acesso Contratos.gov - somente leitura
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe-official-data.mjs'
      - '.github/workflows/sondar-dados-oficiais.yml'
permissions:
  contents: read
jobs:
  sondagem:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar sintaxe, unitarios e esquema publico
        run: |
          npm run check:syntax
          npm test
          npm run check:data
      - name: Sondar dados sem persistencia ou credenciais
        run: node src/probe-official-data.mjs
      - name: Comparar instrumento de cobranca historico com e sem filtro IFC
        run: node src/probe-official-data.mjs --billing-historical
