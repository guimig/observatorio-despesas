name: Coletar CGU - Observatório

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cgu.mjs'
      - 'src/collect-cgu.mjs'
      - '.github/workflows/coleta-cgu.yml'
  schedule:
    # 01:27, 07:27, 13:27 e 19:27 em Brasília.
    - cron: '27 10 * * *'
    - cron: '27 4,16,22 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-cgu
  queue: max

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_status: ${{ steps.collect.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar disponibilidade do Secret no repositorio
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -z "$CGU_API_KEY" ]; then
            echo "Chave CGU nao cadastrada neste repositorio. Coleta ignorada."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Testar antes de coletar
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm test
          npm run check:data
      - name: Coleta incremental CGU
        id: collect
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          # Mantém a janela de reconciliação matinal e prioriza o dia em curso nas demais rodadas.
          CGU_LOOKBACK_DAYS: ${{ (github.event_name != 'schedule' || github.event.schedule == '27 10 * * *') && '7' || '3' }}
          CGU_INCLUDE_TODAY: 'true'
          CGU_MAX_PAGES: '30'
          CGU_MAX_IMPACT_PAGES: '8'
        run: npm run collect:cgu
      - name: Validar dados publicados
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Publicar apenas JSONs do observatorio
        id: commit
        if: steps.credential.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/manifest.json data/months/
          if git diff --cached --quiet; then
            echo "JSONs inalterados: nenhum commit necessario."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: atualizar documentos CGU normalizados'
          bash scripts/push-validated-data.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml

  avaliar:
    needs: [atualizar, publicar]
    if: ${{ always() && needs.atualizar.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Conferir sucesso efetivo das fontes
        env:
          SOURCE_STATUS: ${{ needs.atualizar.outputs.source_status }}
        run: |
          if [ "$SOURCE_STATUS" != "complete" ]; then
            echo "::warning::Coleta parcial, indisponivel ou sem credencial; dados validos preservados."
            exit 1
          fi
