name: Coletar CGU - Observatório

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cgu.mjs'
  schedule:
    - cron: '27 10 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-main
  queue: max

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar disponibilidade do Secret no repositorio
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -z "$CGU_API_KEY" ]; then
            echo "Chave CGU nao cadastrada neste repositorio. Coleta ignorada."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Testar antes de coletar
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm test
          npm run check:data
      - name: Coleta incremental CGU
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          CGU_LOOKBACK_DAYS: '7'
          CGU_MAX_PAGES: '30'
          CGU_MAX_IMPACT_PAGES: '8'
        run: npm run collect:cgu
      - name: Validar dados publicados
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Publicar apenas JSONs do observatorio
        id: commit
        if: steps.credential.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/manifest.json data/months/
          if git diff --cached --quiet; then
            echo "JSONs inalterados: nenhum commit necessario."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: atualizar documentos CGU normalizados'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
