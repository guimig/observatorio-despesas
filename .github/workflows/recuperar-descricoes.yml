name: Recuperar textos publicos de empenhos e contratacoes
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Publicacoes por catalogo (1 a 20)'
        type: choice
        required: true
        default: '5'
        options: ['2','5','10','20']
      cgu_days:
        description: 'Dias com NEs sem texto por lote (1 a 7)'
        type: choice
        required: true
        default: '2'
        options: ['1','2','3','5','7']
  push:
    branches: [main]
    paths:
      - '.github/workflows/recuperar-descricoes.yml'
      - 'src/collect-public-narratives.mjs'
      - 'src/cgu-classification-review.mjs'
  schedule:
    - cron: '41 3,15 * * *'

permissions:
  contents: read
jobs:
  recuperar:
    strategy:
      fail-fast: false
      matrix:
        source: [cgu, pncp]
    concurrency:
      group: observatorio-coleta-${{ matrix.source }}
      queue: max
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NARRATIVE_SCOPE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar dados e privacidade antes da consulta
        run: |
          npm test
          npm run check:data
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-narrative.json
          key: narrative-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: narrative-v1-${{ matrix.source }}-
      - name: Registrar checkpoint operacional anterior
        id: retention-before
        run: |
          file="$RUNNER_TEMP/observatorio-narrative.json"
          if [ -f "$file" ]; then echo "digest=$(sha256sum "$file" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"; else echo 'digest=missing' >> "$GITHUB_OUTPUT"; fi
      - name: Resumir pendencias de textos sem dados individuais
        env:
          NARRATIVE_STATE_PATH: ${{ runner.temp }}/observatorio-narrative.json
        run: |
          echo '### Recuperacao de descricoes historicas' >> "$GITHUB_STEP_SUMMARY"
          npm run narratives:plan >> "$GITHUB_STEP_SUMMARY"
      - name: Recuperar textos oficiais ausentes
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          NARRATIVE_BATCH: ${{ inputs.batch || '15' }}
          NARRATIVE_STATE_PATH: ${{ runner.temp }}/observatorio-narrative.json
          NARRATIVE_CGU_DAYS: ${{ inputs.cgu_days || '5' }}
          NARRATIVE_OTHER_PHASE_DAYS: '3'
          CGU_CLASSIFICATION_DAYS: '8'
        run: npm run collect:narratives
      - name: Conferir integridade e privacidade das fichas
        run: npm run check:data
      - name: Versionar apenas JSONs publicos alterados
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ "$NARRATIVE_SCOPE" = cgu ]; then
            git add -- data/manifest.json data/months/
          else
            git add -- data/procurement/notices.json data/procurement/contracts.json
          fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum texto ou classificacao adicional disponivel.'
            exit 0
          fi
          git commit -m 'data: recuperar descricoes e classificacao publicas'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Comparar checkpoint operacional
        id: retention-after
        env:
          BEFORE: ${{ steps.retention-before.outputs.digest }}
        run: |
          file="$RUNNER_TEMP/observatorio-narrative.json"
          if [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d ' ' -f1)" != "$BEFORE" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v4
        if: steps.retention-after.outputs.changed == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-narrative.json
          key: narrative-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
  publicar:
    needs: recuperar
    if: github.event_name == 'workflow_dispatch' && needs.recuperar.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
