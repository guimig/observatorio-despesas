name: Verificar participacao do Campus em atas PNCP
on:
  workflow_dispatch:
  schedule:
    - cron: '21 */4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/coletar-participantes-arp.yml'
      - 'src/pncp-ata-participants.mjs'
      - 'src/collect-pncp-ata-participants.mjs'
      - 'src/arp-details.mjs'
      - 'src/collect-arp-details.mjs'
permissions:
  contents: read
concurrency:
  group: observatorio-coleta-pncp
  queue: max
jobs:
  coletar:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-participation.json
          key: arp-participation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arp-participation-v1-
      - name: Registrar checkpoint operacional anterior
        id: retention-before
        run: |
          file="$RUNNER_TEMP/observatorio-participation.json"
          if [ -f "$file" ]; then echo "digest=$(sha256sum "$file" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"; else echo 'digest=missing' >> "$GITHUB_OUTPUT"; fi
      - name: Consultar partes de atas PNCP
        env:
          PNCP_PARTICIPANTS_LIMIT: '30'
          PNCP_PARTICIPANT_STATE_PATH: ${{ runner.temp }}/observatorio-participation.json
        run: npm run collect:pncp-ata-participants
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-arp-details.json
          key: arp-detail-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arp-detail-v1-
      - name: Registrar estado anterior
        id: before
        run: |
          file="$RUNNER_TEMP/observatorio-arp-details.json"
          if [ -f "$file" ]; then echo "digest=$(sha256sum "$file" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"; else echo 'digest=missing' >> "$GITHUB_OUTPUT"; fi
      - name: Consultar itens de ARP e instrumentos decorrentes
        env:
          ARP_DETAIL_STATE_PATH: ${{ runner.temp }}/observatorio-arp-details.json
        run: |
          set -o pipefail
          node src/collect-arp-details.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run check:data
      - name: Persistir apenas evidencias institucionais
        id: commit
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          if [ ! -f data/procurement/ata-participants.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/procurement/ata-participants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: atualizar participacao em atas PNCP'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verificar alteracao do estado
        id: after
        env:
          BEFORE: ${{ steps.before.outputs.digest }}
        run: |
          file="$RUNNER_TEMP/observatorio-arp-details.json"
          if [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d ' ' -f1)" != "$BEFORE" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v4
        if: steps.after.outputs.changed == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-arp-details.json
          key: arp-detail-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Comparar checkpoint operacional
        id: retention-after
        env:
          BEFORE: ${{ steps.retention-before.outputs.digest }}
        run: |
          file="$RUNNER_TEMP/observatorio-participation.json"
          if [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d ' ' -f1)" != "$BEFORE" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v4
        if: steps.retention-after.outputs.changed == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-participation.json
          key: arp-participation-v1-${{ github.run_id }}-${{ github.run_attempt }}
  publicar:
    needs: coletar
    if: github.event_name == 'workflow_dispatch' && needs.coletar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
