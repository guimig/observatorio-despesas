name: Diagnosticar vínculos PNCP contrato-contratação sem valores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnosticar-vinculos-pncp.yml']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar segurança e sintaxe
        run: |
          node --check src/inspect-pncp-links.mjs
          npm test
      - name: Sondar somente esquema oficial
        run: node src/inspect-pncp-links.mjs
