name: Publicar Observatorio - GitHub Pages

# Deploy por Actions, nao a partir dos arquivos do branch Pages.
# workflow_call permite publicar apos coleta feita pelo GITHUB_TOKEN:
# esse push nao dispara workflows configurados com on: push.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-pages.yml'
      - 'index.html'
      - '.nojekyll'
      - 'assets/**'
      - 'data/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: observatorio-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout do ultimo estado da main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar testes e integridade dos dados publicos
        run: |
          npm test
          npm run check:data
      - name: Empacotar somente interface e JSONs permitidos
        run: npm run build:site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato imutavel para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          # Reexecucoes de um job preservam o run_id e incrementam run_attempt.
          # Nome unico impede deploy ambiguo de dois artefatos "github-pages".
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist
      # O artefato pode demorar a aparecer na API do GitHub Actions,
      # mesmo após upload bem-sucedido. Retentativas são apenas de deploy:
      # não repetem coleta nem alteram os JSONs versionados.
      - name: Publicar nova versao - primeira tentativa
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Aguardar propagacao do artefato
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Publicar nova versao - segunda tentativa
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Aguardar segunda propagacao
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 40
      - name: Publicar nova versao - tentativa final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_final
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirmar arquivos efetivamente servidos pelo Pages
        env:
          SITE_BASE: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
        run: npm run verify:pages
