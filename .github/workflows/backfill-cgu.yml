name: Recuperar historico CGU - Observatorio

on:
  workflow_dispatch:
    inputs:
      intensive:
        description: 'Usar recuperacao automatica intensiva quando nao houver mes nem recheck'
        type: boolean
        default: false
      month:
        description: 'Competencia AAAA-MM (vazio = ultima competencia incompleta)'
        type: string
        required: false
      earliest_month:
        description: 'Competencia mais antiga da varredura automatica AAAA-MM (padrao 2024-01)'
        type: string
        required: false
        default: '2024-01'
      days:
        description: 'Dias por lote (maximo 7)'
        type: choice
        required: true
        default: '5'
        options: ['1', '2', '3', '5', '7']
      start_day:
        description: 'Dia inicial do mes (1 a 31)'
        type: string
        required: false
        default: '1'
      priority_references:
        description: 'Priorizar anos das NEs referenciadas ausentes (auto, true ou false)'
        type: choice
        required: false
        default: 'auto'
        options: ['auto', 'true', 'false']
      recheck:
        description: 'Reconsultar inclusive dias ja completos?'
        type: boolean
        required: false
        default: false
  # A primeira entrada deste workflow na main recupera o primeiro lote.
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-cgu.yml'
      - 'src/backfill-adaptive.mjs'
      - 'src/backfill-cgu.mjs'
      - 'src/backfill.mjs'
      - 'src/historical-collector.mjs'
      - 'src/recover-liquidation-values.mjs'
      - 'src/store.mjs'
  # Seis rodadas distribuidas, evitando inicio da hora; somente lacunas.
  schedule:
    - cron: '13 1,5,9,13,17,21 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-cgu
  queue: max

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar Secret da CGU
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -z "$CGU_API_KEY" ]; then
            echo 'Secret CGU_API_KEY ausente: backfill ignorado.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Testar coletores e arquivos publicados
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm test
          npm run check:data
      - name: Buscar proximo lote historico
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          BACKFILL_MONTH: ${{ inputs.month }}
          BACKFILL_EARLIEST_MONTH: ${{ inputs.earliest_month || '2024-01' }}
          BACKFILL_DAYS: ${{ inputs.days || '5' }}
          BACKFILL_INTENSIVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.intensive) && 'true' || 'false' }}
          BACKFILL_ADAPTIVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.intensive) && 'true' || 'false' }}
          # Lacunas documentadas na issue #88. So voltam a fila se ainda incompletas.
          BACKFILL_PRIORITY_DATES: '2026-10-14,2026-10-15,2026-10-16'
          BACKFILL_START_DAY: ${{ inputs.start_day || '1' }}
          BACKFILL_RECHECK: ${{ inputs.recheck || 'false' }}
          BACKFILL_ROTATE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          BACKFILL_PRIORITY_REFERENCES: ${{ github.event_name == 'push' && 'true' || inputs.priority_references || 'auto' }}
          CGU_MAX_PAGES: '30'
          CGU_MAX_IMPACT_PAGES: '8'
        run: |
          set -o pipefail
          npm run backfill:cgu | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Diagnosticar cobertura após o lote
        if: steps.credential.outputs.enabled == 'true'
        run: npm run diagnose:coverage
      - name: Validar checkpoint antes de publicar
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Versionar apenas JSONs mensais alterados
        if: steps.credential.outputs.enabled == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/manifest.json data/months/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhuma alteracao no lote historico.'
            exit 0
          fi
          git commit -m 'data: acrescentar lote historico CGU validado'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Resumir cobertura gravada na main
        if: steps.credential.outputs.enabled == 'true'
        run: GITHUB_SHA="$(git rev-parse HEAD)" node src/diagnose-coverage.mjs --audit-md >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: atualizar
    if: github.event_name == 'workflow_dispatch' && needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
