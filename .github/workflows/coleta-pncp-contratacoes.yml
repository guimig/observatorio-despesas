name: Coletar editais e contratacoes diretas PNCP - IFC
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Competência AAAA-MM (vazio = mês corrente)'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/coleta-pncp-contratacoes.yml'
      - 'src/pncp-notices.mjs'
  schedule:
    - cron: '22 11 * * 2,5'
    - cron: '22 16 * * *'
permissions:
  contents: read
concurrency:
  group: observatorio-coleta-main
  queue: max
jobs:
  coletar:
    runs-on: ubuntu-22.04
    timeout-minutes: 27
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar e validar JSONs antigos
        run: |
          npm test
          npm run check:data
      - name: Consultar PNCP de todas as modalidades pelo CNPJ da Reitoria
        env:
          PNCP_NOTICE_MONTH: ${{ inputs.month }}
          PNCP_NOTICE_HISTORICAL: ${{ github.event.schedule == '22 16 * * *' && 'true' || 'false' }}
        run: npm run collect:pncp-notices
      - name: Verificar integridade e privacidade
        run: npm run check:data
      - name: Salvar somente publicacoes PNCP normalizadas
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/procurement/notices.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: registrar licitacoes e contratacoes diretas PNCP centralizadas'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publicar:
    needs: coletar
    if: needs.coletar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
