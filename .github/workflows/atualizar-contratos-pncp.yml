name: Atualizar contratos e empenhos PNCP por data de atualizacao
on:
  workflow_dispatch:
    inputs:
      days:
        type: choice
        description: 'Limite de dias por janela (1, 3 ou 7); sem reprocessar dias ja confirmados'
        required: true
        default: '3'
        options: ['1','3','7']
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-contratos-pncp.yml'
      - 'src/pncp-delta.mjs'
      - 'src/collect-pncp-delta.mjs'
      - 'src/recover-pncp-publications.mjs'
  schedule:
    - cron: '47 13 * * *'

permissions:
  contents: read
concurrency:
  group: observatorio-coleta-main
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar coletores e validar catalogo existente
        run: |
          npm run check:syntax
          npm test
          npm run check:data
      - name: Planejar janela sem chamar APIs
        env:
          PNCP_DELTA_DAYS: ${{ inputs.days || '3' }}
        run: npm run pncp-delta:plan >> "$GITHUB_STEP_SUMMARY"
      - name: Consultar todas as paginas PNCP sem dados financeiros CGU
        env:
          PNCP_DELTA_DAYS: ${{ inputs.days || '3' }}
          PNCP_DELTA_MAX_PAGES: '20'
          PNCP_RECOVERY_MAX_PAGES: '25'
        run: npm run collect:pncp-delta
      - name: Validar esquema e privacidade apos consulta
        run: npm run check:data
      - name: Versionar somente catalogo efetivamente alterado
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/procurement/contracts.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sem novo checkpoint ou revisao: nenhum commit.'
            exit 0
          fi
          git commit -m 'data: atualizar janela PNCP por data global e registrar cobertura'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
