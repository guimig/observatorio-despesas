name: Verificar empenhos PNCP vinculados aos contratos do IFC

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Quantidade de contratos por execução'
        type: choice
        required: false
        default: '8'
        options: ['4','8','12','20']
      recheck:
        description: 'Forçar nova consulta dos contratos já verificados'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/consultar-empenhos-pncp.yml'
  schedule:
    - cron: '47 12 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-main
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes e validar dados anteriores
        run: |
          npm test
          npm run check:data
      - name: Consultar NEs vinculadas no PNCP (sem token ou conteúdo pessoal)
        env:
          PNCP_COMMITMENT_BATCH: ${{ inputs.batch || '8' }}
          PNCP_COMMITMENT_RECHECK: ${{ inputs.recheck || 'false' }}
        run: npm run collect:pncp-ne
      - name: Validar catálogo e política de privacidade
        run: npm run check:data
      - name: Versionar apenas catálogo modificado
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/procurement/contracts.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sem informações novas.'
            exit 0
          fi
          git commit -m 'data: atualizar evidencias de NE associadas a contratos PNCP'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publicar:
    needs: enriquecer
    if: needs.enriquecer.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
