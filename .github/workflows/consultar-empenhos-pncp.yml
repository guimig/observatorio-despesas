name: Verificar empenhos PNCP vinculados aos contratos do IFC

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Quantidade de contratos por execução'
        type: choice
        required: false
        default: '8'
        options: ['4','8','12','20']
      recheck:
        description: 'Forçar nova consulta dos contratos já verificados'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/consultar-empenhos-pncp.yml'
      - 'src/pncp-commitment-fields.mjs'
  schedule:
    - cron: '47 12 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-pncp
  queue: max

jobs:
  enriquecer:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes e validar dados anteriores
        run: |
          npm test
          npm run check:data
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-pncp-ne-state.json
          key: pncp-ne-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pncp-ne-state-v2-
      - name: Registrar estado anterior do cache
        id: state_before
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-pncp-ne-state.json
        run: |
          if [ -f "$STATE_PATH" ]; then
            echo "digest=$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo 'digest=missing' >> "$GITHUB_OUTPUT"
          fi
      - name: Consultar NEs vinculadas no PNCP (sem token ou conteúdo pessoal)
        env:
          PNCP_COMMITMENT_BATCH: ${{ inputs.batch || '20' }}
          PNCP_NE_STATE_PATH: ${{ runner.temp }}/observatorio-pncp-ne-state.json
          PNCP_COMMITMENT_RECHECK: ${{ inputs.recheck || 'false' }}
        run: npm run collect:pncp-ne
      - name: Validar catálogo e política de privacidade
        run: npm run check:data
      - name: Versionar apenas catálogo modificado
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/procurement/contracts.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sem informações novas.'
            exit 0
          fi
          git commit -m 'data: atualizar evidencias de NE associadas a contratos PNCP'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verificar se o estado operacional mudou
        id: state_after
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-pncp-ne-state.json
          PREVIOUS_DIGEST: ${{ steps.state_before.outputs.digest }}
        run: |
          if [ -f "$STATE_PATH" ] && [ "$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" != "$PREVIOUS_DIGEST" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.state_after.outputs.changed == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-pncp-ne-state.json
          key: pncp-ne-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
  publicar:
    needs: enriquecer
    if: github.event_name == 'workflow_dispatch' && needs.enriquecer.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
