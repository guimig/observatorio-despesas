name: Sondar NE abreviada PNCP e CGU - sem vincular
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe-pncp-short-identity.mjs'
      - '.github/workflows/sondar-ne-abreviada-pncp.yml'
permissions:
  contents: read
jobs:
  sondagem:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pncp-short-identity.test.mjs
      - run: node src/probe-pncp-short-identity.mjs
