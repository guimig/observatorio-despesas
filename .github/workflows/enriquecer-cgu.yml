name: Enriquecer liquidações, pagamentos e itens CGU

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Competencia AAAA-MM (vazio = mais recente com pendencias)'
        required: false
        type: string
      liquidations:
        description: 'Liquidacoes por lote'
        required: false
        type: choice
        default: '12'
        options: ['5','10','12','20']
      payments:
        description: 'Pagamentos por lote'
        required: false
        type: choice
        default: '15'
        options: ['5','10','15','30']
      items:
        description: 'Empenhos para detalhar por lote'
        required: false
        type: choice
        default: '7'
        options: ['3','7','10','15']
  push:
    branches: [main]
    paths:
      - '.github/workflows/enriquecer-cgu.yml'
  schedule:
    - cron: '17 12 * * *'
    - cron: '17 22 * * *'
    - cron: '17 17 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-main
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar Secret
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -z "$CGU_API_KEY" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'CGU_API_KEY nao configurada; rotina ignorada.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Testar normalizacao, privacidade e integridade
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm test
          npm run check:data
      - name: Consultar somente documentos sem enriquecimento concluido
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          ENRICH_MONTH: ${{ inputs.month }}
          ENRICH_PRIORITY: ${{ github.event.schedule == '17 12 * * *' && 'oldest' || github.event.schedule == '17 17 * * *' && 'oldest' || 'newest' }}
          ENRICH_LIQUIDATIONS: ${{ inputs.liquidations || '12' }}
          ENRICH_PAYMENTS: ${{ inputs.payments || '15' }}
          ENRICH_ITEMS: ${{ inputs.items || '7' }}
        run: npm run enrich:cgu
      - name: Validar todos os JSONs antes da publicacao
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Publicar somente JSONs alterados
        if: steps.credential.outputs.enabled == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/months/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum enriquecimento novo para versionar.'
            exit 0
          fi
          git commit -m 'data: enriquecer vinculos de liquidacoes, pagamentos e itens CGU'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
