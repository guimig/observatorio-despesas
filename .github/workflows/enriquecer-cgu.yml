name: Enriquecer liquidações, pagamentos e itens CGU

on:
  workflow_dispatch:
    inputs:
      intensive:
        description: 'Permitir orcamento intensivo quando houver passivo'
        type: boolean
        default: false
      month:
        description: 'Competencia AAAA-MM (vazio = distribuir entre meses com pendencias)'
        required: false
        type: string
      liquidations:
        description: 'Liquidacoes por lote'
        required: false
        type: choice
        default: '12'
        options: ['5','10','12','20','30','40']
      payments:
        description: 'Pagamentos por lote'
        required: false
        type: choice
        default: '15'
        options: ['5','10','15','30','36','50']
      items:
        description: 'Empenhos para detalhar por lote'
        required: false
        type: choice
        default: '7'
        options: ['3','7','10','15','20']
  push:
    branches: [main]
    paths:
      - '.github/workflows/enriquecer-cgu.yml'
      - 'src/enrich-cgu.mjs'
      - 'src/item-movements.mjs'
      - 'src/enrich-month.mjs'
      - 'src/chronology-enrichment.mjs'
      - 'assets/siafi-movement-reconciliation.js'
      - 'src/audit-cgu-interannual.mjs'
  schedule:
    - cron: '37 2,6,10,14,18,22 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-cgu
  queue: max

jobs:
  atualizar:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Commits de GITHUB_TOKEN não reexecutam todos os fluxos; quando várias
          # coletas são enfileiradas, cada uma precisa ler o HEAD mais recente.
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar Secret
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -z "$CGU_API_KEY" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'CGU_API_KEY nao configurada; rotina ignorada.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Testar normalizacao, privacidade e integridade
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm test
          npm run check:data
      - name: Auditar cruzamentos interanuais existentes (so contagens)
        if: steps.credential.outputs.enabled == 'true'
        run: npm run audit:cgu-interannual
      - uses: actions/cache/restore@v5
        if: steps.credential.outputs.enabled == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-history-state.json
          key: cgu-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cgu-history-v1-
      - name: Registrar estado anterior do cache
        if: steps.credential.outputs.enabled == 'true'
        id: state_before
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-history-state.json
        run: |
          if [ -f "$STATE_PATH" ]; then
            echo "digest=$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo 'digest=missing' >> "$GITHUB_OUTPUT"
          fi
      - name: Consultar documentos pendentes e revisar historicos vencidos
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          ENRICH_MONTH: ${{ inputs.month }}
          ENRICH_PRIORITY: ${{ github.event_name == 'schedule' && 'round_robin' || 'newest' }}
          ENRICH_INTENSIVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.intensive) && 'true' || 'false' }}
          ENRICH_LIQUIDATIONS: ${{ inputs.liquidations || '40' }}
          ENRICH_PAYMENTS: ${{ inputs.payments || '50' }}
          ENRICH_ITEMS: ${{ inputs.items || '20' }}
          ENRICH_HISTORY_ITEMS: ${{ (github.event_name != 'workflow_dispatch' || inputs.intensive) && '30' || '10' }}
          CGU_HISTORY_STATE_PATH: ${{ runner.temp }}/observatorio-history-state.json
        run: |
          set -o pipefail
          npm run enrich:cgu | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validar todos os JSONs antes da publicacao
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Publicar somente JSONs alterados
        if: steps.credential.outputs.enabled == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/months/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum enriquecimento novo para versionar.'
            exit 0
          fi
          git commit -m 'data: enriquecer vinculos de liquidacoes, pagamentos e itens CGU'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verificar se o estado operacional mudou
        if: steps.credential.outputs.enabled == 'true'
        id: state_after
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-history-state.json
          PREVIOUS_DIGEST: ${{ steps.state_before.outputs.digest }}
        run: |
          if [ -f "$STATE_PATH" ] && [ "$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" != "$PREVIOUS_DIGEST" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v5
        if: steps.state_after.outputs.changed == 'true' && steps.credential.outputs.enabled == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-history-state.json
          key: cgu-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
  publicar:
    needs: atualizar
    if: github.event_name == 'workflow_dispatch' && needs.atualizar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
