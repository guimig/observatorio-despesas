name: Coletar atas de registro de precos PNCP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coletar-atas-pncp.yml'
      - 'src/pncp-atas.mjs'
      - 'src/collect-pncp-atas.mjs'
  schedule:
    - cron: '43 12 * * *'
permissions:
  contents: read
concurrency:
  group: observatorio-coleta-pncp
  queue: max
jobs:
  coletar:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar integridade
        run: |
          npm test
          npm run check:data
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-ata-state.json
          key: ata-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ata-state-v1-
      - name: Registrar estado anterior do cache
        id: state_before
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-ata-state.json
        run: |
          if [ -f "$STATE_PATH" ]; then
            echo "digest=$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo 'digest=missing' >> "$GITHUB_OUTPUT"
          fi
      - name: Consultar atas de compras SRP publicadas
        env:
          PNCP_ATA_LIMIT: '24'
          ATA_STATE_PATH: ${{ runner.temp }}/observatorio-ata-state.json
        run: npm run collect:pncp-atas
      - name: Validar catalogo minimo
        run: npm run check:data
      - name: Salvar catalogo sem respostas brutas
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ ! -f data/procurement/atas.json ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- data/procurement/atas.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: atualizar atas PNCP'
          bash scripts/push-validated-data.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verificar se o estado operacional mudou
        id: state_after
        env:
          STATE_PATH: ${{ runner.temp }}/observatorio-ata-state.json
          PREVIOUS_DIGEST: ${{ steps.state_before.outputs.digest }}
        run: |
          if [ -f "$STATE_PATH" ] && [ "$(sha256sum "$STATE_PATH" | cut -d ' ' -f1)" != "$PREVIOUS_DIGEST" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.state_after.outputs.changed == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/observatorio-ata-state.json
          key: ata-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
  publicar:
    needs: coletar
    if: github.event_name == 'workflow_dispatch' && needs.coletar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
