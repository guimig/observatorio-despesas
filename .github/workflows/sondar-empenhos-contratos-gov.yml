name: Sondar empenhos Contratos.gov por UG e exercicio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe-contratos-commitments.mjs'
      - '.github/workflows/sondar-empenhos-contratos-gov.yml'
permissions:
  contents: read
jobs:
  sondagem:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/contratos-commitments-probe.test.mjs
      - run: node src/probe-contratos-commitments.mjs
