name: Recuperar origens CGU de NEs referenciadas - por codigo
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximo de NEs consultadas por rodada (ate 5)'
        type: choice
        required: true
        default: '3'
        options: ['1','3','5']
      slot:
        description: 'Rodada de paginacao logica (vazio = automatica)'
        type: string
        required: false
      year:
        description: 'Exercicio da NE a partir de 2024 (vazio = todos)'
        type: string
        required: false
        default: 'all'
      scope:
        description: 'Escopo: same_year, interannual ou all'
        type: choice
        required: false
        default: 'all'
        options: ['same_year','interannual','all']
  push:
    branches: [main]
    paths:
      - 'src/recover-cgu-originals.mjs'
      - '.github/workflows/recuperar-origens-cgu.yml'
  schedule:
    - cron: '31 13 * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-coleta-main
  queue: max

jobs:
  recuperar:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar chave CGU
        id: credential
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          if [ -n "$CGU_API_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Secret CGU_API_KEY ausente; coleta individual ignorada.'
          fi
      - name: Testar esquema e privacidade do acervo existente
        if: steps.credential.outputs.enabled == 'true'
        run: |
          npm run check:syntax
          npm test
          npm run check:data
      - name: Planejar selecao sem requisicoes autenticadas
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_ORIGINAL_SCOPE: ${{ inputs.scope || 'all' }}
          CGU_ORIGINAL_YEAR: ${{ inputs.year || 'all' }}
        run: npm run recovery:cgu-plan >> "$GITHUB_STEP_SUMMARY"
      - name: Consultar NEs referenciadas no escopo selecionado
        if: steps.credential.outputs.enabled == 'true'
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          CGU_ORIGINAL_LIMIT: ${{ inputs.limit || '3' }}
          CGU_ORIGINAL_YEAR: ${{ inputs.year || 'all' }}
          CGU_ORIGINAL_SCOPE: ${{ inputs.scope || 'all' }}
          CGU_ORIGINAL_SLOT: ${{ inputs.slot || '' }}
        run: npm run recover:cgu-originals
      - name: Validar arquivos mensais e manifesto apos a recuperacao
        if: steps.credential.outputs.enabled == 'true'
        run: npm run check:data
      - name: Commit apenas de origem documental validada
        id: commit
        if: steps.credential.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/manifest.json data/months/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum documento de origem CGU incorporado.'
            exit 0
          fi
          git commit -m 'data: recuperar origens CGU de NEs referenciadas por identificador'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publicar:
    needs: recuperar
    if: needs.recuperar.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-pages.yml
