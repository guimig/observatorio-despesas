name: Validar Observatório

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: npm run check:syntax
      - name: Testes unitarios
        run: npm test
      - name: Testar sondagem efemera de arquivos CGU
        run: python3 -m unittest discover -s test -p test_probe_cgu_downloads.py
      - name: Validar privacidade e esquema dos JSONs versionados
        run: npm run check:data
      - name: Validar diagnostico interanual CGU contra dados canonicos
        run: npm run audit:cgu-interannual
      - name: Validar artefato de publicacao (sem secrets e codigo-fonte)
        run: npm run build:site
      - name: Validar planejamento de coleta historica
        run: npm run backfill:plan
      - name: Resumir cobertura documental sem dados sensiveis
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node src/diagnose-coverage.mjs --audit-md >> "$GITHUB_STEP_SUMMARY"
